<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Telegram AI Agent{% endblock %} — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f1117; color: #e2e8f0; }
        .card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; }
        .badge-green { background: #16a34a22; color: #4ade80; border: 1px solid #16a34a44; }
        .badge-red { background: #dc262622; color: #f87171; border: 1px solid #dc262644; }
        .badge-yellow { background: #d9770622; color: #fbbf24; border: 1px solid #d9770644; }
        .btn-primary { background: #4f46e5; color: white; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary:hover { background: #4338ca; }
        .btn-danger { background: #dc2626; color: white; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; color: #94a3b8; font-size: 14px; font-weight: 500; transition: all 0.15s; }
        .sidebar-link:hover, .sidebar-link.active { background: #4f46e522; color: #818cf8; }
        input, textarea, select { background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 8px 12px; color: #e2e8f0; font-size: 14px; width: 100%; }
        input:focus, textarea:focus { outline: none; border-color: #4f46e5; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #13151f; color: #94a3b8; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 16px; text-align: left; }
        td { padding: 12px 16px; border-bottom: 1px solid #1e2030; font-size: 14px; }
        tr:hover td { background: #1e2030; }
    </style>
</head>
<body x-data="{ token: localStorage.getItem('token') }">

{% if request.url.path != '/dashboard/login' %}
<div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 flex-shrink-0 border-r border-[#2d3148] flex flex-col p-4">
        <div class="flex items-center gap-3 mb-8 px-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">S</div>
            <div>
                <div class="font-semibold text-sm">Shaxzodbek</div>
                <div class="text-xs text-slate-500">AI Agent</div>
            </div>
        </div>
        <nav class="space-y-1 flex-1">
            <a href="/dashboard/" class="sidebar-link {% if active_page == 'home' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Asosiy
            </a>
            <a href="/dashboard/chats" class="sidebar-link {% if active_page == 'chats' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                Suhbatlar
            </a>
            <a href="/dashboard/memory" class="sidebar-link {% if active_page == 'memory' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"></path></svg>
                Xotira
            </a>
            <a href="/dashboard/logs" class="sidebar-link {% if active_page == 'logs' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Loglar
            </a>
            <a href="/dashboard/settings" class="sidebar-link {% if active_page == 'settings' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Sozlamalar
            </a>
        </nav>
        <button onclick="localStorage.removeItem('token'); window.location.href='/dashboard/login'"
            class="sidebar-link text-red-400 hover:text-red-300 mt-4">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Chiqish
        </button>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-auto p-6">
{% endif %}

{% block content %}{% endblock %}

{% if request.url.path != '/dashboard/login' %}
    </main>
</div>
{% endif %}

<script>
// API helper
async function api(path, method = 'GET', body = null) {
    const token = localStorage.getItem('token');
    const opts = {
        method,
        headers: { 'Content-Type': 'application/json' }
    };
    if (token) opts.headers['Authorization'] = `Bearer ${token}`;
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch('/api' + path, opts);
    if (res.status === 401) { window.location.href = '/dashboard/login'; return null; }
    return res.json();
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
