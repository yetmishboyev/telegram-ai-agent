{% extends "base.html" %}
{% set active_page = "chats" %}
{% block title %}Suhbatlar{% endblock %}

{% block content %}
<div class="p-6" x-data="chatsPage()" x-init="init()">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
        <div>
            <h1 class="text-lg font-semibold text-slate-200">Suhbatlar</h1>
            <p class="text-slate-500 text-xs mt-0.5" x-text="'Jami ' + total + ' foydalanuvchi'"></p>
        </div>
        <div class="flex items-center gap-2">
            <div class="relative">
                <svg class="w-4 h-4 text-slate-600 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
                </svg>
                <input x-model="search" @input.debounce.300ms="filterUsers()"
                    type="text" placeholder="Ism yoki username..."
                    class="pl-9 pr-3 py-2 text-sm" style="width:220px">
            </div>
            <select x-model="filterStatus" @change="filterUsers()" class="text-sm py-2" style="width:130px">
                <option value="">Barchasi</option>
                <option value="active">Faol</option>
                <option value="blocked">Bloklangan</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="card overflow-hidden">
        <table>
            <thead>
                <tr>
                    <th>Foydalanuvchi</th>
                    <th>Telegram ID</th>
                    <th>Xabarlar</th>
                    <th>Oxirgi faollik</th>
                    <th>Holat</th>
                    <th>Amallar</th>
                </tr>
            </thead>
            <tbody>
                <!-- Skeleton -->
                <template x-if="loading">
                    <template x-for="i in [1,2,3,4,5]" :key="i">
                        <tr>
                            <td>
                                <div class="flex items-center gap-2.5">
                                    <div class="skeleton w-8 h-8 rounded-full flex-shrink-0"></div>
                                    <div class="space-y-1.5">
                                        <div class="skeleton h-3.5 w-28"></div>
                                        <div class="skeleton h-2.5 w-16"></div>
                                    </div>
                                </div>
                            </td>
                            <td><div class="skeleton h-3.5 w-20"></div></td>
                            <td><div class="skeleton h-3.5 w-6"></div></td>
                            <td><div class="skeleton h-3.5 w-24"></div></td>
                            <td><div class="skeleton h-5 w-16 rounded-full"></div></td>
                            <td></td>
                        </tr>
                    </template>
                </template>

                <!-- Data rows -->
                <template x-if="!loading">
                    <template x-for="u in filtered" :key="u.id">
                        <tr>
                            <td>
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0"
                                        :style="`background: ${avatarColor(u.telegram_id)}`"
                                        x-text="initials(u.name)"></div>
                                    <div>
                                        <div class="text-sm font-medium text-slate-200" x-text="u.name"></div>
                                        <div class="text-xs text-slate-600" x-text="u.username ? '@'+u.username : ''"></div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="font-mono text-xs text-slate-500" x-text="u.telegram_id"></span>
                            </td>
                            <td>
                                <span class="text-sm text-slate-400" x-text="u.total_messages"></span>
                            </td>
                            <td>
                                <span class="text-xs text-slate-500" x-text="fmtDate(u.last_seen)"></span>
                            </td>
                            <td>
                                <span class="badge" :class="u.is_blacklisted ? 'badge-red' : 'badge-green'"
                                    x-text="u.is_blacklisted ? 'Bloklangan' : 'Faol'"></span>
                            </td>
                            <td>
                                <div class="flex items-center gap-3">
                                    <a :href="'/dashboard/chats/'+u.telegram_id"
                                        class="text-indigo-400 text-xs hover:text-indigo-300 font-medium">Ko'rish</a>
                                    <button @click="toggleBlock(u)"
                                        class="text-xs font-medium transition-colors"
                                        :class="u.is_blacklisted
                                            ? 'text-emerald-500 hover:text-emerald-400'
                                            : 'text-red-500 hover:text-red-400'"
                                        x-text="u.is_blacklisted ? 'Blokdan chiqar' : 'Blokla'">
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </template>
            </tbody>
        </table>

        <!-- Empty state -->
        <div x-show="!loading && filtered.length === 0"
            class="flex flex-col items-center justify-center py-16 text-slate-600">
            <svg class="w-12 h-12 mb-3 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            <p class="text-sm" x-text="search ? 'Hech narsa topilmadi' : 'Hali suhbatlar yo\'q'"></p>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function chatsPage() {
    return {
        allUsers: [],
        filtered: [],
        total: 0,
        loading: true,
        search: '',
        filterStatus: '',
        async init() {
            const data = await api('/chats/?limit=200');
            if (data) {
                this.allUsers = data.users || [];
                this.total = data.total || this.allUsers.length;
            }
            this.filterUsers();
            this.loading = false;
        },
        filterUsers() {
            let list = [...this.allUsers];
            if (this.search) {
                const q = this.search.toLowerCase();
                list = list.filter(u =>
                    (u.name || '').toLowerCase().includes(q) ||
                    (u.username || '').toLowerCase().includes(q) ||
                    String(u.telegram_id).includes(q)
                );
            }
            if (this.filterStatus === 'active') list = list.filter(u => !u.is_blacklisted);
            if (this.filterStatus === 'blocked') list = list.filter(u => u.is_blacklisted);
            this.filtered = list;
        },
        async toggleBlock(u) {
            const action = u.is_blacklisted ? 'unblacklist' : 'blacklist';
            const method = u.is_blacklisted ? 'DELETE' : 'POST';
            await api(`/chats/${u.telegram_id}/blacklist`, method);
            u.is_blacklisted = !u.is_blacklisted;
            window.toast(
                u.is_blacklisted ? `${u.name} bloklandi` : `${u.name} blokdan chiqarildi`,
                u.is_blacklisted ? 'warn' : 'success'
            );
            this.filterUsers();
        }
    }
}
</script>
{% endblock %}
