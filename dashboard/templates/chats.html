{% extends "base.html" %}
{% set active_page = "chats" %}
{% block title %}Suhbatlar{% endblock %}

{% block content %}
<div x-data="chatsPage()" x-init="init()">
    <h1 class="text-xl font-bold mb-6">Suhbatlar</h1>

    <div class="card overflow-hidden">
        <table>
            <thead>
                <tr>
                    <th>Foydalanuvchi</th>
                    <th>Telegram ID</th>
                    <th>Xabarlar</th>
                    <th>Oxirgi faollik</th>
                    <th>Holat</th>
                    <th>Amallar</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="u in users" :key="u.id">
                    <tr>
                        <td>
                            <div class="font-medium" x-text="u.name"></div>
                            <div class="text-slate-500 text-xs" x-text="u.username ? '@'+u.username : ''"></div>
                        </td>
                        <td class="text-slate-400 font-mono text-sm" x-text="u.telegram_id"></td>
                        <td x-text="u.total_messages"></td>
                        <td class="text-slate-400 text-sm" x-text="u.last_seen ? new Date(u.last_seen).toLocaleString('uz') : '—'"></td>
                        <td>
                            <span :class="u.is_blacklisted ? 'badge-red' : 'badge-green'"
                                class="px-2 py-0.5 rounded text-xs font-medium border"
                                x-text="u.is_blacklisted ? 'Bloklangan' : 'Faol'">
                            </span>
                        </td>
                        <td>
                            <div class="flex gap-2">
                                <a :href="'/dashboard/chats/'+u.telegram_id"
                                    class="text-indigo-400 text-sm hover:text-indigo-300">Ko'rish</a>
                                <button @click="toggleBlacklist(u)"
                                    :class="u.is_blacklisted ? 'text-green-400 hover:text-green-300' : 'text-red-400 hover:text-red-300'"
                                    class="text-sm"
                                    x-text="u.is_blacklisted ? 'Blokdan chiqar' : 'Blokla'">
                                </button>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function chatsPage() {
    return {
        users: [],
        async init() {
            const data = await api('/chats/?limit=100');
            if (data) this.users = data.users;
        },
        async toggleBlacklist(u) {
            await api('/admin/blacklist', 'POST', {
                telegram_id: u.telegram_id,
                blacklisted: !u.is_blacklisted
            });
            u.is_blacklisted = !u.is_blacklisted;
        }
    }
}
</script>
{% endblock %}
