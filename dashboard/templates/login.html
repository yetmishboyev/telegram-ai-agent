{% extends "base.html" %}
{% block title %}Kirish{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#080b14]">
    <div class="w-full max-w-xs" x-data="loginPage()">

        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white font-bold text-xl shadow-2xl shadow-indigo-900/50 mb-4">S</div>
            <h1 class="text-lg font-semibold text-slate-200">Shaxzodbek AI</h1>
            <p class="text-slate-600 text-sm mt-0.5">Admin panelga kirish</p>
        </div>

        <!-- Form card -->
        <div class="card p-6">
            <form @submit.prevent="login()">
                <div class="mb-4">
                    <label class="block text-xs font-medium text-slate-500 mb-1.5">Username</label>
                    <input type="text" x-model="username"
                        placeholder="admin"
                        autocomplete="username"
                        class="text-sm py-2.5"
                        :class="error ? 'border-red-500/50' : ''">
                </div>
                <div class="mb-5">
                    <label class="block text-xs font-medium text-slate-500 mb-1.5">Parol</label>
                    <div class="relative">
                        <input :type="showPw ? 'text' : 'password'"
                            x-model="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            class="text-sm py-2.5 pr-10"
                            :class="error ? 'border-red-500/50' : ''">
                        <button type="button" @click="showPw = !showPw"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-600 hover:text-slate-400">
                            <svg x-show="!showPw" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg x-show="showPw" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit"
                    class="btn btn-primary w-full justify-center py-2.5 text-sm"
                    :disabled="loading">
                    <svg x-show="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <span x-text="loading ? 'Kirilmoqda...' : 'Kirish'"></span>
                </button>

                <div x-show="error" x-transition
                    class="mt-3 p-2.5 bg-red-500/10 border border-red-500/25 rounded-lg text-red-400 text-xs text-center"
                    x-text="error"></div>
            </form>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// FastAPI xato javobini o'qiladigan matnga aylantiradi. 401/429 da `detail`
// satr bo'ladi, 422 (validatsiya) da esa [{loc, msg, ...}] MASSIVI — uni
// to'g'ridan-to'g'ri x-text ga bersak "[object Object]" chiqib qolardi.
function errorText(detail, fallback) {
    if (!detail) return fallback;
    if (typeof detail === 'string') return detail;
    if (Array.isArray(detail)) {
        const msgs = detail.map(d => d && d.msg).filter(Boolean);
        return msgs.length ? msgs.join('; ') : fallback;
    }
    return detail.msg || fallback;
}

function loginPage() {
    return {
        username: '',
        password: '',
        showPw: false,
        loading: false,
        error: '',
        async login() {
            // Bo'sh maydonlar serverga borsa 422 qaytadi va xabar tushunarsiz
            // bo'ladi — shuning uchun shu yerda to'xtatamiz. (Brauzer parolni
            // avto-to'ldirgandek ko'rsatib, DOM ga yozmagan holat ham shu yerga tushadi.)
            if (!this.username.trim() || !this.password) {
                this.error = 'Username va parolni kiriting';
                return;
            }
            this.loading = true;
            this.error = '';
            try {
                const form = new FormData();
                form.append('username', this.username);
                form.append('password', this.password);
                const res = await fetch('/api/auth/token', { method: 'POST', body: form });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/dashboard/';
                } else {
                    this.error = errorText(data.detail, 'Login yoki parol noto\'g\'ri');
                }
            } catch {
                this.error = 'Server bilan bog\'lanishda xato';
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
