[project]
name = "telegram-ai-agent"
version = "1.0.0"
description = "Personal Telegram AI Agent - Production Ready"
authors = [{ name = "Shaxzodbek", email = "airijarvis@gmail.com" }]
requires-python = ">=3.13"

dependencies = [
    # Telegram
    "telethon>=1.36.0",
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
    "aiofiles>=24.1.0",
    # AI Providers
    "openai>=1.55.0",
    # 0.104+ — output_config.effort (yangi avlod modellari uchun shart)
    "anthropic>=0.104.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Redis
    "redis[hiredis]>=5.2.0",
    # Vector DB
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3.0",
    # Settings & Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",
    "cryptography>=43.0.0",
    # Logging
    "loguru>=0.7.2",
    # Utilities
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "pytz>=2024.2",
    "arrow>=1.3.0",
    "apscheduler>=3.10.4",
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
