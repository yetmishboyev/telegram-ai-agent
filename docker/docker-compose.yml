version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tg-agent-app
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ../.env
    volumes:
      - ../sessions:/app/sessions
      - ../logs:/app/logs
      - ../dashboard:/app/dashboard
      - ../app:/app/app
      - ../tests:/app/tests
      - ../alembic:/app/alembic
      - ../alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - agent-net

  postgres:
    image: postgres:16-alpine
    container_name: tg-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d telegram_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  redis:
    image: redis:7-alpine
    container_name: tg-agent-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: tg-agent-chromadb
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "false"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - agent-net

  caddy:
    image: caddy:2-alpine
    container_name: tg-agent-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - agent-net

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  caddy_data:
  caddy_config:

networks:
  agent-net:
    driver: bridge
